<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Auction browser: shows auctions that have not started yet. -->
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BidHive – Upcoming Auctions</title>
<link rel="stylesheet" href="shared.css"/>
<style>
  .page-hero { position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:48px 5% 0; }
  .page-hero h1 { font-family:var(--font-display);font-size:clamp(28px,4vw,42px);color:var(--text);display:flex;align-items:center;gap:14px;margin-bottom:6px; }
  .page-hero p { font-size:14px;color:var(--text-muted);margin-bottom:2rem; }
  .count-badge { font-size:13px;color:var(--text-dim);margin-bottom:1.5rem; }
  .count-badge span { color:var(--text-muted);font-weight:500; }
</style>
</head>
<body>
<div class="bg-glow"></div>
<nav id="main-nav"></nav>

<div class="page-hero">
  <h1>
    <span class="nav-dot dot-blue" style="width:12px;height:12px;flex-shrink:0;"></span>
    Upcoming auctions
  </h1>
  <p>Auctions scheduled to go live soon — keep an eye on the clock.</p>
</div>

<div class="page-wrap">
  <p class="count-badge" id="count-label"></p>
  <div class="auction-grid" id="auction-grid"></div>
</div>

<script src="shared.js"></script>
<script>
  renderNav("upcoming");

  const EMOJI_MAP = { Watches:"⌚", Art:"🎨", Electronics:"💻", Jewellery:"💎", Antiques:"🏺", Music:"🎸", Photography:"📷", Furniture:"🪑", Books:"📚", Fashion:"👗", Sports:"⚽", Vehicles:"🚗" };

  function skeletons(n=6) {
    return Array(n).fill(0).map(()=>`
      <div class="skeleton">
        <div class="card-thumb" style="background:var(--surface2);"></div>
        <div class="card-body">
          <div class="skel-block" style="width:55px;height:9px;margin-bottom:8px;"></div>
          <div class="skel-block" style="width:90%;height:13px;margin-bottom:5px;"></div>
          <div class="skel-block" style="width:65%;height:13px;margin-bottom:14px;"></div>
          <div class="skel-block" style="width:80px;height:18px;"></div>
        </div>
        <div class="card-footer" style="border-top:1px solid var(--border);">
          <div class="skel-block" style="width:110px;height:11px;"></div>
        </div>
      </div>`).join("");
  }

  function renderCard(a) {
    const emoji = EMOJI_MAP[a.category] || "🏷️";
    const diff  = new Date(a.start_time) - new Date();
    const hrs   = Math.floor(diff / 3600000);
    const startsIn = hrs >= 24 ? Math.floor(hrs/24) + "d " + (hrs%24) + "h" : hrs + "h " + Math.floor((diff%3600000)/60000) + "m";
    const bidVal = a.current_highest_bid > 0 ? formatINR(a.current_highest_bid) : "No bids yet";
    const bidsCount = a.current_highest_bid > 0 ? "Bids placed" : "0 bids yet";
    return `
      <a class="auction-card" href="auction-detail.html?id=${a._id}">
        <div class="card-thumb">
          ${a.image_url ? `<img src="${a.image_url}" alt="${a.item_name}" loading="lazy"/>` : emoji}
          <span class="card-badge"><span class="pill pill-blue" style="font-size:10px;">Upcoming</span></span>
        </div>
        <div class="card-body">
          <div class="card-category">${a.category || "General"}</div>
          <div class="card-title">${a.item_name}</div>
          <div class="card-meta">
            <div style="display:flex; justify-content: space-between; width: 100%;">
              <div>
                <div class="meta-label">Starts in</div>
                <div class="meta-value" style="color:var(--blue);">${startsIn}</div>
              </div>
              <div style="text-align:right;">
                <div class="meta-label">Current bid</div>
                <div class="meta-value">${bidVal}</div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-footer">
          <span class="timer" style="color:var(--blue);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            ${formatDate(a.start_time)}
          </span>
          <span class="bids-count">${bidsCount}</span>
        </div>
      </a>`;
  }

  async function load() {
    document.getElementById("auction-grid").innerHTML = skeletons(6);
    try {
      const all = await apiFetch("/api/auctions");
      const now = new Date();
      const upcoming = all.filter(a => a.status === "active" && new Date(a.start_time) > now)
                          .sort((a,b) => new Date(a.start_time) - new Date(b.start_time));
      document.getElementById("count-label").innerHTML = `<span>${upcoming.length}</span> auction${upcoming.length !== 1 ? "s" : ""} coming up`;
      if (!upcoming.length) {
        document.getElementById("auction-grid").innerHTML = `<div class="empty-state"><p>No upcoming auctions scheduled right now.</p></div>`;
        return;
      }
      document.getElementById("auction-grid").innerHTML = upcoming.map(renderCard).join("");
    } catch(e) {
      document.getElementById("auction-grid").innerHTML = `<div class="error-state">Failed to load. Is your server running?</div>`;
    }
  }

  load();
</script>
</body>
</html>
