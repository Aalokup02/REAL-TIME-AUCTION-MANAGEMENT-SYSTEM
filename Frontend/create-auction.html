<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Seller page: creates a new auction listing and optional image. -->
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BidHive – List an Item</title>
<link rel="stylesheet" href="shared.css"/>
<style>
  .form-wrap { position:relative;z-index:1;max-width:640px;margin:0 auto;padding:40px 5% 80px; }
  .back-link { display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);text-decoration:none;margin-bottom:2rem;transition:color 0.15s; }
  .back-link:hover { color:var(--text); }
  .page-title { font-family:var(--font-display);font-size:32px;color:var(--text);margin-bottom:6px; }
  .page-sub { font-size:14px;color:var(--text-muted);margin-bottom:2rem; }
  .form-card { background:rgba(30, 33, 40, 0.6); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:2.5rem; box-shadow:0 24px 48px -12px rgba(0,0,0,0.5); }
  .form-row { display:grid;grid-template-columns:1fr 1fr;gap:16px; }
  .form-divider { border:none;border-top:1px solid rgba(255,255,255,0.05);margin:2rem 0; }
  .section-label { font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);margin-bottom:1.25rem; display:flex; align-items:center; gap:8px; }
  .section-label::before { content:''; display:block; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  
  /* Custom File Uploader */
  .file-drop-area { position:relative; width:100%; padding:2.5rem 1.5rem; border:2px dashed rgba(255,255,255,0.15); border-radius:12px; text-align:center; transition:all 0.2s ease; background:rgba(0,0,0,0.2); cursor:pointer; overflow:hidden; }
  .file-drop-area:hover, .file-drop-area.dragover { border-color:var(--accent); background:rgba(245, 166, 35, 0.05); }
  .file-drop-area svg { width:32px; height:32px; color:var(--text-muted); margin-bottom:12px; transition:color 0.2s; }
  .file-drop-area:hover svg { color:var(--accent); }
  .file-drop-text { font-size:14px; font-weight:500; color:var(--text); margin-bottom:4px; }
  .file-drop-sub { font-size:12px; color:var(--text-dim); }
  .file-drop-input { position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }
  
  @media(max-width:500px) { .form-row{grid-template-columns:1fr;} .form-card { padding: 1.5rem; } }
</style>
</head>
<body>
<div class="bg-glow"></div>
<nav id="main-nav"></nav>

<div class="form-wrap">
  <a href="index.html" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Back to home
  </a>
  <h1 class="page-title">List an item</h1>
  <p class="page-sub">Fill in the details below to create your auction listing.</p>

  <div class="form-card">
    <p class="section-label">Item details</p>
    <div class="form-field">
      <label class="form-label">Item name</label>
      <input type="text" id="item_name" class="form-input" placeholder="e.g. Vintage Rolex Submariner 1966"/>
    </div>
    <div class="form-field">
      <label class="form-label">Description</label>
      <textarea id="description" class="form-textarea" placeholder="Describe the item — condition, provenance, what's included…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-field">
        <label class="form-label">Category</label>
        <select id="category" class="form-select">
          <option value="">Select a category</option>
          <option>Watches</option>
          <option>Art</option>
          <option>Electronics</option>
          <option>Jewellery</option>
          <option>Antiques</option>
          <option>Music</option>
          <option>Photography</option>
          <option>Furniture</option>
          <option>Books</option>
          <option>Fashion</option>
          <option>Sports</option>
          <option>Vehicles</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-field">
        <label class="form-label">Starting Bid (₹)</label>
        <input type="number" id="starting_bid" class="form-input" min="0" placeholder="0"/>
      </div>
    </div>
    <div class="form-field">
      <label class="form-label">Upload product image</label>
      <div class="file-drop-area" id="file-drop-area">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <div class="file-drop-text">Click to browse or drag image here</div>
        <div class="file-drop-sub">PNG, JPG up to 10MB</div>
        <input type="file" id="image_file" class="file-drop-input" accept="image/*" onchange="previewImage(event)"/>
      </div>
      <div id="image_preview" style="margin-top:16px; display:none; position:relative; width:max-content;">
        <img src="" id="img_tag" style="max-width:100%; max-height:240px; object-fit:cover; border-radius:12px; border:1px solid var(--border); box-shadow:0 8px 16px rgba(0,0,0,0.4);" />
        <button onclick="clearImage()" style="position:absolute; top:-10px; right:-10px; background:var(--red); color:white; border:none; border-radius:50%; width:24px; height:24px; cursor:pointer; font-weight:bold; box-shadow:0 4px 8px rgba(0,0,0,0.3);">×</button>
      </div>
    </div>

    <hr class="form-divider"/>
    <p class="section-label">Auction schedule</p>

    <div class="form-row">
      <div class="form-field">
        <label class="form-label">Start time</label>
        <input type="datetime-local" id="start_time" class="form-input"/>
      </div>
      <div class="form-field">
        <label class="form-label">End time</label>
        <input type="datetime-local" id="end_time" class="form-input"/>
      </div>
    </div>

    <button class="btn-primary" id="submit-btn" onclick="submitAuction()" style="width:100%;margin-top:0.5rem;">
      Create listing
    </button>
  </div>
</div>

<script src="shared.js"></script>
<script>
  // Guard: seller only
  const user = getUser() || (getToken() ? decodeToken(getToken()) : null);
  if (!getToken()) { window.location.href = "auction-auth.html"; }
  else if (user && user.role !== "seller") {
    document.querySelector(".form-card").innerHTML = `<div class="empty-state"><p>Only sellers can create listings.</p></div>`;
  }

  renderNav();

  // Default start to now + 10min, end to now + 1hr
  const now = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  function toLocal(d) {
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  const defaultStart = new Date(now.getTime() + 10 * 60000);
  const defaultEnd   = new Date(now.getTime() + 60 * 60000);
  document.getElementById("start_time").value = toLocal(defaultStart);
  document.getElementById("end_time").value   = toLocal(defaultEnd);

  let base64ImageData = null;

  function previewImage(event) {
    const file = event.target.files[0];
    if (!file) {
      clearImage();
      return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
      base64ImageData = e.target.result;
      document.getElementById("img_tag").src = base64ImageData;
      document.getElementById("image_preview").style.display = "block";
      document.getElementById("file-drop-area").style.display = "none";
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
      base64ImageData = null;
      document.getElementById("image_file").value = "";
      document.getElementById("image_preview").style.display = "none";
      document.getElementById("file-drop-area").style.display = "block";
  }

  const dropArea = document.getElementById('file-drop-area');
  dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.classList.add('dragover'); });
  dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
  dropArea.addEventListener('drop', (e) => {
    e.preventDefault();
    dropArea.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      document.getElementById('image_file').files = e.dataTransfer.files;
      previewImage({ target: { files: e.dataTransfer.files } });
    }
  });

  async function submitAuction() {
    const item_name   = document.getElementById("item_name").value.trim();
    const description = document.getElementById("description").value.trim();
    const category    = document.getElementById("category").value;
    const start_time  = document.getElementById("start_time").value;
    const end_time    = document.getElementById("end_time").value;
    const starting_bid= Number(document.getElementById("starting_bid").value) || 0;

    if (!item_name || !category || !start_time || !end_time) {
      showToast("Please fill in all required fields.", "error"); return;
    }
    if (new Date(end_time) <= new Date(start_time)) {
      showToast("End time must be after start time.", "error"); return;
    }

    const btn = document.getElementById("submit-btn");
    btn.disabled = true; btn.textContent = "Creating listing…";

    try {
      const payload = { item_name, description, category, start_time, end_time, current_highest_bid: starting_bid };
      if (base64ImageData) {
        payload.image_url = base64ImageData;
      }

      const data = await apiFetch("/api/auctions", {
        method: "POST",
        body: JSON.stringify(payload)
      });
      showToast("Auction listed successfully!", "success");
      setTimeout(() => window.location.href = "auction-detail.html?id=" + data._id, 900);
    } catch(e) {
      showToast(e.message || "Failed to create listing.", "error");
    } finally {
      btn.disabled = false; btn.textContent = "Create listing";
    }
  }
</script>
</body>
</html>
