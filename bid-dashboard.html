<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Account dashboard: displays bids, listings, wins, and payment actions. -->
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BidHive – Bid Dashboard</title>
<meta name="description" content="View live bid activity, track your personal bids, and complete payment for auctions you've won."/>
<link rel="stylesheet" href="shared.css"/>
<style>
  /* ── Page Layout ── */
  .dash-wrap { position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:40px 5% 80px; }

  /* ── Page Header ── */
  .dash-header { margin-bottom:2rem; }
  .dash-title { font-family:var(--font-display);font-size:clamp(28px,4vw,40px);color:var(--text);margin-bottom:6px; }
  .dash-sub { font-size:14px;color:var(--text-muted); }

  /* ── Tabs ── */
  .tab-bar { display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;margin-bottom:2rem;width:fit-content; }
  .tab-btn { padding:8px 20px;border-radius:6px;border:none;background:transparent;color:var(--text-muted);font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;transition:background 0.15s,color 0.15s;white-space:nowrap;display:flex;align-items:center;gap:7px; }
  .tab-btn.active { background:var(--accent-dim);color:var(--accent);border:1px solid rgba(245,166,35,0.2); }
  .tab-btn:hover:not(.active) { color:var(--text);background:rgba(255,255,255,0.04); }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  /* ── Stats Row ── */
  .stats-row { display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:2rem; }
  .stat-chip { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem; }
  .stat-chip-label { font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--text-dim);margin-bottom:5px; }
  .stat-chip-value { font-family:var(--font-display);font-size:28px;color:var(--text); }
  .stat-chip-value.accent { color:var(--accent); }
  .stat-chip-value.green  { color:var(--green); }

  /* ── Auction bid card ── */
  .auction-bid-card {
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;margin-bottom:16px;transition:border-color 0.2s;
  }
  .auction-bid-card:hover { border-color:var(--border-hover); }

  .abc-header {
    display:flex;align-items:center;gap:16px;padding:1rem 1.25rem;
    cursor:pointer;user-select:none;
  }
  .abc-emoji { font-size:36px;width:56px;height:56px;background:var(--surface2);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0; }
  .abc-info { flex:1;min-width:0; }
  .abc-category { font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-dim);margin-bottom:3px; }
  .abc-name { font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .abc-meta { font-size:12px;color:var(--text-muted);margin-top:2px; }
  .abc-right { display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0; }
  .abc-bid-label { font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim); }
  .abc-bid-value { font-family:var(--font-display);font-size:22px;color:var(--accent); }
  .abc-chevron { color:var(--text-dim);transition:transform 0.2s;font-size:14px; }
  .abc-chevron.open { transform:rotate(180deg); }

  /* ── Leaderboard inside card ── */
  .abc-body { display:none;border-top:1px solid var(--border);background:var(--surface2); }
  .abc-body.open { display:block; }
  .leader-header { display:grid;grid-template-columns:36px 1fr 120px 120px;gap:8px;padding:8px 1.25rem;font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-dim);border-bottom:1px solid var(--border); }
  .leader-row { display:grid;grid-template-columns:36px 1fr 120px 120px;gap:8px;align-items:center;padding:10px 1.25rem;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;transition:background 0.15s; }
  .leader-row:hover { background:rgba(255,255,255,0.02); }
  .leader-row:last-child { border-bottom:none; }
  .leader-rank { font-family:var(--font-display);font-size:15px; }
  .rank-1 { color:var(--accent); }
  .rank-2 { color:#b0b8c8; }
  .rank-3 { color:#c8894a; }
  .leader-name { display:flex;align-items:center;gap:9px;color:var(--text); }
  .bidder-avatar { width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text-muted);flex-shrink:0; }
  .leader-amount { color:var(--text);font-weight:600; }
  .leader-time { color:var(--text-dim); }
  .you-badge { font-size:10px;padding:2px 7px;background:var(--accent-dim);color:var(--accent);border-radius:10px;font-weight:600;margin-left:4px; }

  /* ── My Bids view ── */
  .my-bid-row {
    display:grid;grid-template-columns:56px 1fr auto auto;gap:14px;align-items:center;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:1rem 1.25rem;margin-bottom:12px;transition:border-color 0.2s;
  }
  .my-bid-row:hover { border-color:var(--border-hover); }
  .my-bid-emoji { font-size:30px;width:50px;height:50px;background:var(--surface2);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center; }
  .my-bid-info .title { font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px; }
  .my-bid-info .cat { font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em; }
  .my-bid-info .time { font-size:11px;color:var(--text-muted);margin-top:2px; }
  .my-bid-amount { text-align:right; }
  .my-bid-amount .label { font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin-bottom:3px; }
  .my-bid-amount .value { font-size:16px;font-weight:600;color:var(--text); }
  .my-bid-status { display:flex;flex-direction:column;align-items:flex-end;gap:6px; }

  /* ── Won Auctions (pay tab) ── */
  .won-card {
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:1.25rem 1.5rem;margin-bottom:16px;display:grid;
    grid-template-columns:64px 1fr auto;gap:16px;align-items:center;
  }
  .won-emoji { font-size:36px;width:58px;height:58px;background:var(--surface2);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0; }
  .won-info .item-name { font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px; }
  .won-info .item-cat  { font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px; }
  .won-info .item-amount { font-family:var(--font-display);font-size:24px;color:var(--accent); }
  .won-action { text-align:right;flex-shrink:0; }
  .btn-pay-now { display:inline-flex;align-items:center;gap:7px;padding:10px 22px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#0d0f14;font-family:var(--font-body);font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;transition:background 0.15s,transform 0.1s;white-space:nowrap; }
  .btn-pay-now:hover { background:var(--accent-hover); }
  .btn-pay-now:active { transform:scale(0.97); }
  .paid-chip { display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--green-dim);border:1px solid rgba(76,175,130,0.2);border-radius:var(--radius-sm);color:var(--green);font-size:12px;font-weight:600; }
  .txn-id { font-size:11px;color:var(--text-dim);font-family:monospace;margin-top:5px; }

  /* ── Loading / Empty states ── */
  .abc-emoji img, .my-bid-emoji img, .won-emoji img { width:100%; height:100%; object-fit:cover; border-radius:var(--radius-sm); display:block; }
  .loading-dots { display:flex;gap:5px;align-items:center;justify-content:center;padding:3rem; }
  .loading-dots span { width:8px;height:8px;border-radius:50%;background:var(--text-dim);animation:ldots 1s infinite; }
  .loading-dots span:nth-child(2){animation-delay:0.15s}
  .loading-dots span:nth-child(3){animation-delay:0.3s}
  @keyframes ldots { 0%,100%{opacity:0.3;transform:scale(0.8)} 50%{opacity:1;transform:scale(1)} }

  /* ── Login gate ── */
  .login-gate { text-align:center;padding:4rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius); }
  .login-gate .icon { font-size:40px;margin-bottom:1rem; }
  .login-gate h3 { font-family:var(--font-display);font-size:22px;color:var(--text);margin-bottom:6px; }
  .login-gate p { font-size:14px;color:var(--text-muted);margin-bottom:1.5rem; }

  /* ── Payment Modal ── */
  .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity 0.2s; }
  .modal-overlay.open { opacity:1;pointer-events:all; }
  .modal-box { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:460px;max-height:90vh;overflow-y:auto;animation:modalIn 0.25s ease; }
  @keyframes modalIn { from{opacity:0;transform:scale(0.95)translateY(10px)} to{opacity:1;transform:scale(1)translateY(0)} }
  .modal-head { display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border); }
  .modal-head h2 { font-family:var(--font-display);font-size:22px;color:var(--text); }
  .modal-close { background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:4px;transition:color 0.15s; }
  .modal-close:hover { color:var(--text); }
  .modal-body { padding:1.5rem; }
  .order-summary { background:var(--surface2);border-radius:var(--radius-sm);padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem; }
  .order-summary .item-info .name { font-size:14px;font-weight:600;color:var(--text); }
  .order-summary .item-info .cat { font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em; }
  .order-summary .price-block { text-align:right; }
  .order-summary .price-block .lbl { font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em; }
  .order-summary .price-block .amt { font-family:var(--font-display);font-size:24px;color:var(--accent); }

  .method-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem; }
  .method-card { background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 10px 12px;cursor:pointer;text-align:center;transition:border-color 0.2s,background 0.2s; }
  .method-card:hover { border-color:rgba(245,166,35,0.35); }
  .method-card.active { border-color:var(--accent);background:var(--accent-dim);box-shadow:0 0 0 3px rgba(245,166,35,0.08); }
  .method-icon { font-size:22px;display:block;margin-bottom:6px; }
  .method-label { font-size:12px;font-weight:600;color:var(--text); }

  .method-fields { display:none; }
  .method-fields.show { display:block; }

  .card-row { display:grid;grid-template-columns:1fr 1fr;gap:14px; }
  .input-icon-wrap { position:relative; }
  .input-icon-wrap .form-input { padding-left:40px; }
  .input-icon { position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none; }
  .secure-note { display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);margin-top:6px; }
  .nb-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
  .nb-option { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 10px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color 0.2s; }
  .nb-option:hover,.nb-option.active { border-color:var(--accent); }
  .nb-logo { width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0; }
  .nb-name { font-size:13px;color:var(--text);font-weight:500; }

  .btn-modal-pay { width:100%;height:50px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#0d0f14;font-family:var(--font-display);font-size:17px;cursor:pointer;transition:background 0.15s,transform 0.1s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:1rem; }
  .btn-modal-pay:hover { background:var(--accent-hover); }
  .btn-modal-pay:disabled { opacity:0.5;cursor:not-allowed;transform:none !important; }
  .btn-modal-pay:active { transform:scale(0.98); }
  .payment-success { text-align:center;padding:1.5rem; }
  .payment-success .check { font-size:48px;margin-bottom:12px; }
  .payment-success h3 { font-family:var(--font-display);font-size:24px;color:var(--green);margin-bottom:6px; }
  .payment-success p { font-size:13px;color:var(--text-muted);margin-bottom:4px; }
  .payment-success .txn { font-size:11px;color:var(--text-dim);font-family:monospace; }

  @media(max-width:640px) {
    .my-bid-row { grid-template-columns:46px 1fr;grid-template-rows:auto auto; }
    .my-bid-amount,.my-bid-status { grid-column:2; }
    .won-card { grid-template-columns:1fr;text-align:center; }
    .won-emoji,.won-action { margin:0 auto; }
    .leader-header,.leader-row { grid-template-columns:30px 1fr 90px; }
    .leader-time { display:none; }
  }
</style>
</head>
<body>
<div class="bg-glow"></div>
<nav id="main-nav"></nav>

<div class="dash-wrap">
  <div class="dash-header">
    <h1 class="dash-title">Bid Dashboard</h1>
    <p class="dash-sub">Track live bid activity, your personal bids &amp; complete payments for auctions you've won.</p>
  </div>

  <!-- Stats row (populated by JS) -->
  <div class="stats-row" id="stats-row">
    <div class="stat-chip"><div class="stat-chip-label">Live Auctions</div><div class="stat-chip-value" id="s-live">–</div></div>
    <div class="stat-chip"><div class="stat-chip-label">Total Bids Today</div><div class="stat-chip-value accent" id="s-bids">–</div></div>
    <div class="stat-chip"><div class="stat-chip-label">My Bids Placed</div><div class="stat-chip-value" id="s-mine">–</div></div>
    <div class="stat-chip"><div class="stat-chip-label">Auctions Won</div><div class="stat-chip-value green" id="s-won">–</div></div>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-live" onclick="switchTab('live')">
      <span class="nav-dot dot-green pulse"></span> Live Activity
    </button>
    <button class="tab-btn" id="tab-mine" onclick="switchTab('mine')">
      📋 My Bids
    </button>
    <button class="tab-btn" id="tab-candidates" style="display:none;" onclick="switchTab('candidates')">
      👥 Candidates
    </button>
    <button class="tab-btn" id="tab-won" onclick="switchTab('won')">
      🏆 Won &amp; Pay
    </button>
  </div>

  <!-- Tab: LIVE ACTIVITY -->
  <div class="tab-panel active" id="panel-live">
    <div id="live-content">
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <!-- Tab: MY BIDS -->
  <div class="tab-panel" id="panel-mine">
    <div id="mine-content">
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <!-- Tab: CANDIDATES -->
  <div class="tab-panel" id="panel-candidates">
    <div id="candidates-content">
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <!-- Tab: WON & PAY -->
  <div class="tab-panel" id="panel-won">
    <div id="won-content">
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
  </div>
</div>

<!-- ──────────── PAYMENT MODAL ──────────── -->
<div class="modal-overlay" id="pay-modal" onclick="modalBgClick(event)">
  <div class="modal-box" id="modal-box">
    <div class="modal-head">
      <h2>Complete Payment</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body">
      <!-- injected by JS -->
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
  renderNav("dashboard");

  const EMOJI_MAP = { Watches:"⌚", Art:"🎨", Electronics:"💻", Jewellery:"💎", Antiques:"🏺", Music:"🎸", Photography:"📷", Furniture:"🪑", Books:"📚", Fashion:"👗", Sports:"⚽", Vehicles:"🚗" };
  const emoji = (cat) => EMOJI_MAP[cat] || "🏷️";

  let currentUser = null;
  let allAuctions  = [];
  let myBids       = [];
  let paymentCache = {};   // auctionId → payment doc

  // ── Init ───────────────────────────────────────────────────────────────────
  async function init() {
    const tok = getToken();
    if (tok) currentUser = getUser() || decodeToken(tok);

    try {
      // Always load auctions
      allAuctions = await apiFetch("/api/auctions");
    } catch(e) {
      allAuctions = [];
    }

    // Load user's own bids if logged in
    if (currentUser) {
      try { myBids = await apiFetch("/api/bids/my"); }
      catch(e) { myBids = []; }
    }

    renderStats();
    renderLive();
    renderMine();
    renderWon();
    
    if (currentUser?.role === "seller") {
      document.getElementById("tab-candidates").style.display = "flex";
      renderCandidates();
    }
  }

  // ── Tab switch ──────────────────────────────────────────────────────────────
  function switchTab(name) {
    ["live","mine","candidates","won"].forEach(t => {
      document.getElementById("tab-" + t)?.classList.toggle("active", t === name);
      document.getElementById("panel-" + t)?.classList.toggle("active", t === name);
    });
  }

  // ── Stats ──────────────────────────────────────────────────────────────────
  function renderStats() {
    const now = new Date();
    const live = allAuctions.filter(a => a.status === "active" && new Date(a.start_time) <= now && new Date(a.end_time) >= now);

    // Count won auctions (where I'm highest bidder AND auction closed)
    const wonCount = allAuctions.filter(a => {
      if (!currentUser) return false;
      const wid = a.highest_bidder_id?._id || a.highest_bidder_id;
      const uid = currentUser.id;
      return a.status === "closed" && wid && wid.toString() === uid;
    }).length;

    document.getElementById("s-live").textContent = live.length;
    document.getElementById("s-bids").textContent = myBids.length > 0 ? myBids.length : "–";
    document.getElementById("s-mine").textContent = myBids.length > 0 ? new Set(myBids.map(b => b.auction_id?._id)).size + " auctions" : (currentUser ? "0" : "–");
    document.getElementById("s-won").textContent  = currentUser ? wonCount : "–";
  }

  // ── LIVE ACTIVITY tab ──────────────────────────────────────────────────────
  async function renderLive() {
    const el = document.getElementById("live-content");
    const now = new Date();
    const live = allAuctions.filter(a => a.status === "active" && new Date(a.start_time) <= now && new Date(a.end_time) >= now);

    if (!live.length) {
      el.innerHTML = `<div class="empty-state"><p>No live auctions right now. Check back soon!</p></div>`;
      return;
    }

    // Fetch bid histories for all live auctions in parallel
    const bidHistories = await Promise.all(
      live.map(a => apiFetch("/api/bids/auction/" + a._id).catch(() => []))
    );

    el.innerHTML = live.map((a, i) => auctionBidCard(a, bidHistories[i])).join("");
  }

  function auctionBidCard(a, bids) {
    const id = a._id;
    const myId = currentUser?.id;
    const currentBid = a.current_highest_bid > 0 ? formatINR(a.current_highest_bid) : "No bids yet";

    const leadRows = bids.slice(0, 8).map((b, idx) => {
      const isMe = myId && (b.bidder_id?._id || b.bidder_id)?.toString() === myId;
      const name = b.bidder_id?.name || "Anonymous";
      const initials = name.slice(0,2).toUpperCase();
      const rankIcon = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : (idx + 1);
      const rankCls  = ["rank-1","rank-2","rank-3"][idx] || "";
      return `
        <div class="leader-row">
          <div class="leader-rank ${rankCls}">${rankIcon}</div>
          <div class="leader-name">
            <div class="bidder-avatar">${initials}</div>
            ${name}${isMe ? '<span class="you-badge">You</span>' : ""}
          </div>
          <div class="leader-amount">${formatINR(b.bid_amount)}</div>
          <div class="leader-time">${new Date(b.timestamp).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}</div>
        </div>`;
    }).join("");

    const emptyBids = bids.length === 0
      ? `<div style="padding:1.25rem 1.5rem;font-size:13px;color:var(--text-dim);">No bids placed yet. Be the first!</div>`
      : "";

    return `
      <div class="auction-bid-card" id="abc-${id}">
        <div class="abc-header" onclick="toggleCard('${id}')">
          <div class="abc-emoji">${a.image_url ? `<img src="${a.image_url}" loading="lazy"/>` : emoji(a.category)}</div>
          <div class="abc-info">
            <div class="abc-category">${a.category || "General"}</div>
            <div class="abc-name">${a.item_name}</div>
            <div class="abc-meta">⏱ ${timeLeft(a.end_time)} · ${bids.length} bid${bids.length !== 1 ? "s" : ""}</div>
          </div>
          <div class="abc-right">
            <div class="abc-bid-label">Top bid</div>
            <div class="abc-bid-value">${currentBid}</div>
            <span class="abc-chevron" id="chev-${id}">▾</span>
          </div>
        </div>
        <div class="abc-body" id="body-${id}">
          ${bids.length > 0 ? `
          <div class="leader-header">
            <div>#</div><div>Bidder</div><div>Amount</div><div>Time</div>
          </div>
          ${leadRows}` : emptyBids}
          <div style="padding:10px 1.25rem;border-top:1px solid rgba(255,255,255,0.04);">
            <a href="auction-detail.html?id=${id}" class="btn-accent" style="font-size:13px;">
              View Auction →
            </a>
          </div>
        </div>
      </div>`;
  }

  function toggleCard(id) {
    const body = document.getElementById("body-" + id);
    const chev = document.getElementById("chev-" + id);
    const isOpen = body.classList.contains("open");
    body.classList.toggle("open", !isOpen);
    chev.classList.toggle("open", !isOpen);
  }

  // ── MY BIDS tab ────────────────────────────────────────────────────────────
  function renderMine() {
    const el = document.getElementById("mine-content");

    if (!currentUser) {
      el.innerHTML = loginGate("Sign in to see your bids", "Track every bid you've placed and see where you stand.");
      return;
    }

    if (!myBids.length) {
      el.innerHTML = `<div class="empty-state"><p>You haven't placed any bids yet. <a href="ongoing.html" style="color:var(--accent);">Browse live auctions →</a></p></div>`;
      return;
    }

    const rows = myBids.map(b => {
      const a = b.auction_id;
      if (!a) return "";
      const now = new Date();
      const isActive = a.status === "active" && new Date(a.end_time) > now;
      const isClosed = a.status === "closed" || new Date(a.end_time) < now;
      const myBidId = currentUser?.id;
      const winnerId = (a.highest_bidder_id?._id || a.highest_bidder_id)?.toString();
      const isWinner = isClosed && winnerId === myBidId;
      const isLeading = isActive && winnerId === myBidId;

      const statusPill = isWinner
        ? `<span class="pill pill-green" style="font-size:10px;">🏆 Won</span>`
        : isLeading
        ? `<span class="pill pill-green" style="font-size:10px;"><span class="nav-dot dot-green pulse" style="width:5px;height:5px;"></span> Leading</span>`
        : isClosed
        ? `<span class="pill pill-red" style="font-size:10px;">Ended</span>`
        : `<span class="pill pill-blue" style="font-size:10px;">Active</span>`;

      const payBtn = isWinner
        ? `<button class="btn-pay-now" style="font-size:12px;padding:8px 14px;" onclick="openPayModal('${a._id}','${a.item_name}','${a.category}',${a.current_highest_bid})">💳 Pay Now</button>`
        : "";

      return `
        <div class="my-bid-row">
          <div class="my-bid-emoji">${a.image_url ? `<img src="${a.image_url}" loading="lazy"/>` : emoji(a.category)}</div>
          <div class="my-bid-info">
            <div class="title">${a.item_name}</div>
            <div class="cat">${a.category || "General"}</div>
            <div class="time">${new Date(b.timestamp).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
          </div>
          <div class="my-bid-amount">
            <div class="label">Your bid</div>
            <div class="value">${formatINR(b.bid_amount)}</div>
          </div>
          <div class="my-bid-status">
            ${statusPill}
            ${payBtn}
          </div>
        </div>`;
    }).join("");

    el.innerHTML = rows;
  }

  // ── CANDIDATES tab ─────────────────────────────────────────────────────────
  function renderCandidates() {
    const el = document.getElementById("candidates-content");
    if (!currentUser || currentUser.role !== "seller") return;

    // Filter to auctions where I am the seller
    const myAuctions = allAuctions.filter(a => a.seller_id === currentUser.id || a.seller_id?._id === currentUser.id);

    // Keep only those with a highest bidder
    const candidates = myAuctions.filter(a => a.highest_bidder_id != null);

    if (!candidates.length) {
      el.innerHTML = `<div class="empty-state"><p>None of your listings have winning candidates yet.</p></div>`;
      return;
    }

    const rows = candidates.map(a => {
      const user = a.highest_bidder_id; 
      const now = new Date();
      const isClosed = a.status === "closed" || new Date(a.end_time) < now;

      const statusPill = isClosed
        ? `<span class="pill pill-green" style="font-size:10px;">🏆 Won By Candidate</span>`
        : `<span class="pill pill-blue" style="font-size:10px;"><span class="nav-dot dot-blue pulse" style="width:5px;height:5px;"></span> Currently Winning</span>`;

      return `
        <div class="my-bid-row">
          <div class="my-bid-emoji">${a.image_url ? `<img src="${a.image_url}" loading="lazy"/>` : emoji(a.category)}</div>
          <div class="my-bid-info">
            <div class="title">${a.item_name}</div>
            <div class="cat">Candidate: ${user.name} (${user.email || "No email"})</div>
            <div class="time">Leading with: ${formatINR(a.current_highest_bid)}</div>
          </div>
          <div class="my-bid-status">
            ${statusPill}
          </div>
        </div>`;
    }).join("");

    el.innerHTML = `<h3 style="margin-bottom:1rem;color:var(--text);font-size:15px;font-family:var(--font-display);">Leading / Winning Candidates</h3>` + rows;
  }

  // ── WON & PAY tab ──────────────────────────────────────────────────────────
  async function renderWon() {
    const el = document.getElementById("won-content");

    if (!currentUser) {
      el.innerHTML = loginGate("Sign in to see your wins", "Auctions you've won will appear here with payment options.");
      return;
    }

    const uid = currentUser.id;
    const won = allAuctions.filter(a => {
      const wid = (a.highest_bidder_id?._id || a.highest_bidder_id)?.toString();
      return a.status === "closed" && wid === uid;
    });

    if (!won.length) {
      el.innerHTML = `<div class="empty-state"><p>You haven't won any auctions yet. Keep bidding! <a href="ongoing.html" style="color:var(--accent);">Browse live →</a></p></div>`;
      return;
    }

    // Fetch payment status for each won auction
    const payments = await Promise.all(
      won.map(a => apiFetch("/api/payments/" + a._id).catch(() => null))
    );
    won.forEach((a,i) => { if (payments[i]) paymentCache[a._id] = payments[i]; });

    el.innerHTML = won.map((a, i) => {
      const pmt = payments[i];
      const isPaid = pmt && pmt.status === "paid";
      return `
        <div class="won-card">
          <div class="won-emoji">${a.image_url ? `<img src="${a.image_url}" loading="lazy"/>` : emoji(a.category)}</div>
          <div class="won-info">
            <div class="item-name">${a.item_name}</div>
            <div class="item-cat">${a.category || "General"} · Ended ${formatDate(a.end_time)}</div>
            <div class="item-amount">${formatINR(a.current_highest_bid)}</div>
          </div>
          <div class="won-action">
            ${isPaid
              ? `<div class="paid-chip">✅ Paid</div><div class="txn-id">${pmt.txn_id}</div>`
              : `<button class="btn-pay-now" onclick="openPayModal('${a._id}','${a.item_name}','${a.category}',${a.current_highest_bid})">
                  💳 Pay Now
                </button>`
            }
          </div>
        </div>`;
    }).join("");

    // Update won count stat
    document.getElementById("s-won").textContent = won.length;
  }

  // ── Login gate helper ──────────────────────────────────────────────────────
  function loginGate(title, sub) {
    return `
      <div class="login-gate">
        <div class="icon">🔒</div>
        <h3>${title}</h3>
        <p>${sub}</p>
        <a href="auction-auth.html" class="btn-accent">Sign in to BidHive</a>
      </div>`;
  }

  // ── PAYMENT MODAL ──────────────────────────────────────────────────────────
  let _modalAuctionId, _modalAmount;
  let _selectedMethod = "";
  let _selectedBank   = "";

  function openPayModal(aId, name, cat, amount) {
    _modalAuctionId = aId;
    _modalAmount    = amount;
    _selectedMethod = "";
    _selectedBank   = "";

    // Check if already paid
    const cached = paymentCache[aId];
    if (cached && cached.status === "paid") {
      renderModalPaid(cached, name, amount);
    } else {
      renderModalForm(name, cat, amount);
    }
    document.getElementById("pay-modal").classList.add("open");
  }

  function closeModal() {
    document.getElementById("pay-modal").classList.remove("open");
  }

  function modalBgClick(e) {
    if (e.target === document.getElementById("pay-modal")) closeModal();
  }

  function renderModalForm(name, cat, amount) {
    document.getElementById("modal-body").innerHTML = `
      <div class="order-summary">
        <div class="item-info">
          <div class="name">${name}</div>
          <div class="cat">${cat || "General"}</div>
        </div>
        <div class="price-block">
          <div class="lbl">Amount due</div>
          <div class="amt">${formatINR(amount)}</div>
        </div>
      </div>

      <p class="form-label" style="margin-bottom:12px;">Choose payment method</p>
      <div class="method-grid">
        <div class="method-card" id="pm-card" onclick="selectMethod('card')">
          <span class="method-icon">💳</span>
          <div class="method-label">Card</div>
        </div>
        <div class="method-card" id="pm-upi" onclick="selectMethod('upi')">
          <span class="method-icon">📱</span>
          <div class="method-label">UPI</div>
        </div>
        <div class="method-card" id="pm-netbanking" onclick="selectMethod('netbanking')">
          <span class="method-icon">🏦</span>
          <div class="method-label">Net Banking</div>
        </div>
      </div>

      <!-- Card fields -->
      <div id="fields-card" class="method-fields">
        <div class="form-field">
          <label class="form-label">Cardholder name</label>
          <input type="text" id="m-card-name" class="form-input" placeholder="Name on card"/>
        </div>
        <div class="form-field">
          <label class="form-label">Card number</label>
          <div class="input-icon-wrap">
            <span class="input-icon">💳</span>
            <input type="text" id="m-card-num" class="form-input" placeholder="•••• •••• •••• ••••" maxlength="19" oninput="fmtCard(this)"/>
          </div>
        </div>
        <div class="card-row">
          <div class="form-field">
            <label class="form-label">Expiry</label>
            <input type="text" id="m-card-exp" class="form-input" placeholder="MM / YY" maxlength="7" oninput="fmtExp(this)"/>
          </div>
          <div class="form-field">
            <label class="form-label">CVV</label>
            <input type="password" id="m-card-cvv" class="form-input" placeholder="•••" maxlength="4"/>
          </div>
        </div>
        <div class="secure-note">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          256-bit SSL encrypted. Card details are never stored.
        </div>
      </div>

      <!-- UPI fields -->
      <div id="fields-upi" class="method-fields">
        <div class="form-field">
          <label class="form-label">UPI ID</label>
          <div class="input-icon-wrap">
            <span class="input-icon">@</span>
            <input type="text" id="m-upi-id" class="form-input" placeholder="yourname@upi"/>
          </div>
        </div>
        <div class="secure-note">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Secured via UPI infrastructure.
        </div>
      </div>

      <!-- Net banking -->
      <div id="fields-netbanking" class="method-fields">
        <p class="form-label" style="margin-bottom:10px;">Select your bank</p>
        <div class="nb-grid">
          <div class="nb-option" id="nb-sbi"   onclick="selectBank('sbi')">  <div class="nb-logo" style="background:#1a3c6e;color:#fff;">SBI</div>  <span class="nb-name">State Bank</span></div>
          <div class="nb-option" id="nb-hdfc"  onclick="selectBank('hdfc')"> <div class="nb-logo" style="background:#004c8f;color:#fff;">HDFC</div> <span class="nb-name">HDFC Bank</span></div>
          <div class="nb-option" id="nb-icici" onclick="selectBank('icici')"><div class="nb-logo" style="background:#f26522;color:#fff;">ICICI</div><span class="nb-name">ICICI Bank</span></div>
          <div class="nb-option" id="nb-axis"  onclick="selectBank('axis')"> <div class="nb-logo" style="background:#97144d;color:#fff;">AXIS</div> <span class="nb-name">Axis Bank</span></div>
        </div>
        <div class="secure-note" style="margin-top:12px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Redirects to your bank's secure portal.
        </div>
      </div>

      <button class="btn-modal-pay" id="modal-pay-btn" onclick="submitModalPayment()" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Pay ${formatINR(amount)}
      </button>
      <p style="text-align:center;font-size:11px;color:var(--text-dim);margin-top:8px;">By continuing you agree to BidHive's payment terms.</p>`;
  }

  function renderModalPaid(pmt, name, amount) {
    document.getElementById("modal-body").innerHTML = `
      <div class="payment-success">
        <div class="check">✅</div>
        <h3>Payment Complete!</h3>
        <p>You secured <strong>${name}</strong></p>
        <p>The seller will be in touch shortly.</p>
        <p class="txn">Transaction ID: ${pmt.txn_id}</p>
        <p style="font-size:11px;color:var(--text-dim);margin-top:6px;">Paid on ${new Date(pmt.paid_at).toLocaleString("en-IN")}</p>
        <button class="btn-accent" onclick="closeModal()" style="margin-top:1.25rem;">Close</button>
      </div>`;
  }

  function selectMethod(method) {
    _selectedMethod = method;
    ["card","upi","netbanking"].forEach(m => {
      document.getElementById("pm-" + m)?.classList.toggle("active", m === method);
      document.getElementById("fields-" + m)?.classList.toggle("show", m === method);
    });
    document.getElementById("modal-pay-btn").disabled = false;
  }

  function selectBank(bank) {
    _selectedBank = bank;
    ["sbi","hdfc","icici","axis"].forEach(b => document.getElementById("nb-"+b)?.classList.remove("active"));
    document.getElementById("nb-" + bank)?.classList.add("active");
  }

  function fmtCard(el) {
    let v = el.value.replace(/\D/g,"").substring(0,16);
    el.value = v.match(/.{1,4}/g)?.join(" ") || v;
  }
  function fmtExp(el) {
    let v = el.value.replace(/\D/g,"").substring(0,4);
    if (v.length >= 2) v = v.substring(0,2) + " / " + v.substring(2);
    el.value = v;
  }

  async function submitModalPayment() {
    if (!_selectedMethod) { showToast("Please select a payment method.", "error"); return; }

    let payload = { auction_id: _modalAuctionId, method: _selectedMethod };

    if (_selectedMethod === "card") {
      const num  = (document.getElementById("m-card-num")?.value || "").replace(/\s/g,"");
      const name = (document.getElementById("m-card-name")?.value || "").trim();
      const exp  = (document.getElementById("m-card-exp")?.value || "").trim();
      const cvv  = (document.getElementById("m-card-cvv")?.value || "").trim();
      if (!name || num.length < 16 || !exp || !cvv) { showToast("Complete all card details.", "error"); return; }
      payload.card_last4 = num.slice(-4);
    }
    if (_selectedMethod === "upi") {
      const upi = (document.getElementById("m-upi-id")?.value || "").trim();
      if (!upi || !upi.includes("@")) { showToast("Enter a valid UPI ID (e.g. name@upi).", "error"); return; }
      payload.upi_id = upi;
    }
    if (_selectedMethod === "netbanking") {
      if (!_selectedBank) { showToast("Please select a bank.", "error"); return; }
      payload.upi_id = _selectedBank;
    }

    const btn = document.getElementById("modal-pay-btn");
    btn.disabled = true;
    btn.innerHTML = `<span class="loading-dots" style="padding:0"><span></span><span></span><span></span></span> Processing…`;

    try {
      const data = await apiFetch("/api/payments", { method:"POST", body: JSON.stringify(payload) });
      paymentCache[_modalAuctionId] = data.payment;
      showToast("Payment successful! 🎉", "success");
      // Show success state in modal
      renderModalPaid(data.payment, "", _modalAmount);
      // Refresh won tab silently
      setTimeout(() => renderWon(), 600);
    } catch(e) {
      showToast(e.message || "Payment failed. Try again.", "error");
      btn.disabled = false;
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Pay ${formatINR(_modalAmount)}`;
    }
  }

  // Kick off
  init();
</script>
</body>
</html>
